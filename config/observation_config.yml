# This configuration file supports adding reference ranges to PFE
# Observations (which are later used in graphing observation trends)
# and displaying cut lines in observation trend graphs

# PROMIS cut point information was taken from
# https://www.healthmeasures.net/score-and-interpret/interpret-scores/promis/promis-score-cut-points/promis-adult-score-cut-points

# WHODAS does not have LOINC codes
# QuickDASH does not have LOINC codes
# Musculoskeletal PGIC does not have LOINC codes
# Behavioral Health PGIC Questionnaire does not have LOINC codes


# PROMIS-10 Global Physical Health (GPH) score
"71972-4":
  range:
    low: 4
    high: 20
  cut_points: [] # No cut points available

# PROMIS-10 Global Mental Health (GMH) score
"71970-8":
  range:
    low: 4
    high: 20
  cut_points: [] # No cut points available

# PROMIS-10 Global Physical Health (GPH) score T-score
"71971-6":
  range:
    low: 16.2
    high: 67.7
  cut_points:
    - limit: 36
      label: "Poor"
      color: "rgba(255, 192, 192, 0.4)" # red
    - limit: 43
      label: "Fair"
      color: "rgba(255, 255, 192, 0.4)" # yellow
    - limit: 51
      label: "Good"
      color: "rgba(192, 255, 192, 0.4)" # green
    - limit: 58
      label: "Very Good"
      color: "rgba(192, 255, 192, 0.4)" # green
    - limit: null
      label: "Excellent"
      color: "rgba(192, 255, 192, 0.4)" # green

